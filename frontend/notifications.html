<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Notifications</title>
    <link rel="stylesheet" href="Assets/css/notifications.css">
</head>

<body>

    <div class="back" onclick="history.back()">
        ← Quay lại trang chủ
    </div>

    <div class="history-header">
        <h1>Toàn bộ lịch sử thông báo</h1>
        <div class="header-actions">
            <button id="darkModeToggle" class="mode-toggle-btn">🌙</button>
            <button id="clearHistoryBtn">Xóa sạch toàn bộ lịch sử</button>
        </div>
    </div>

    <div id="list"></div>

    <script>
        const BASE_URL = "http://localhost:3000"; 
        const list = document.getElementById("list");
        const clearBtn = document.getElementById("clearHistoryBtn");
        
        let notifications = JSON.parse(localStorage.getItem("notifications")) || [];

        function renderList() {
            if (notifications.length === 0) {
                list.innerHTML = "<p class='empty'>Hệ thống chưa ghi nhận lịch sử thông báo nào.</p>";
                if (clearBtn) clearBtn.style.display = "none";
                return;
            }

            list.innerHTML = "";
            if (clearBtn) clearBtn.style.display = "block";

            [...notifications].reverse().forEach(itemData => {
                const div = document.createElement("div");
                div.className = "item";

                let textMsg = "";
                if (typeof itemData === 'object' && itemData !== null) {
                    textMsg = itemData.text || "";
                } else {
                    textMsg = itemData;
                }

                div.innerHTML = `
                    <div class="icon">🔔</div>
                    <div class="text">${textMsg}</div>
                `;

                list.appendChild(div);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderList();

            if (clearBtn) {
                clearBtn.addEventListener("click", async () => {
                    const confirmClean = confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử thông báo trên các giao diện đang mở không?");
                    if (!confirmClean) return;

                    try {
                        const response = await fetch(`${BASE_URL}/api/clear-all`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" }
                        });
                        const result = await response.json();

                        if (result.success) {
                            notifications = [];
                            localStorage.removeItem("notifications");
                            renderList();
                            alert("Hệ thống đã được dọn dẹp sạch sẽ!");
                        } else {
                            alert("Thất bại: " + result.message);
                        }
                    } catch (err) {
                        console.error("Lỗi dọn dẹp:", err);
                        alert("Không thể kết nối tới máy chủ để dọn dẹp.");
                    }
                });
            }

            // ĐỒNG BỘ DARK MODE
            const darkModeToggle = document.getElementById("darkModeToggle");
            const body = document.body;

            if (localStorage.getItem("darkMode") === "enabled") {
                body.classList.add("dark-mode");
                if (darkModeToggle) darkModeToggle.innerText = "☀️";
            }

            if (darkModeToggle) {
                darkModeToggle.addEventListener("click", () => {
                    body.classList.toggle("dark-mode");
                    if (body.classList.contains("dark-mode")) {
                        localStorage.setItem("darkMode", "enabled");
                        darkModeToggle.innerText = "☀️";
                    } else {
                        localStorage.setItem("darkMode", "disabled");
                        darkModeToggle.innerText = "🌙";
                    }
                });
            }
        });
    </script>

</body>
</html>
