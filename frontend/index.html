<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASSROOM</title>
    <link rel="stylesheet" href="Assets/css/style.css">
</head>

<body>

    <div class="camera-section">
        <div class="camera-header">
            <div class="container">
                <div class="card">
                    <h2>Nhiệt độ</h2>
                    <div class="value" id="temperature">-- °C</div>
                </div>

                <div class="card">
                    <h2>Độ ẩm</h2>
                    <div class="value" id="humidity">-- %</div>
                </div>

                <div class="card">
                    <h2>Khí Gas</h2>
                    <div class="value" id="gas">--</div>
                </div>

                <div class="card card-controls">
                    <button id="relayBtn" class="btn-relay">TOGGLE RELAY</button>
                    <button id="alertBtn">ALERT</button>
                </div>

                <div class="card settings-card">
                    <h2>Nhiệt độ mong muốn</h2>
                    <label for="comfortTemperature">Nhập nhiệt độ dễ chịu (°C)</label>
                    <input id="comfortTemperature" type="number" min="10" max="45" step="0.1" value="28">
                    <small>Nhấn Enter để xác nhận!</small>
                    <span id="configStatus" class="config-status"></span>
                </div>
            </div>

            <h1 class="dashboard-title">THEO DÕI LỚP HỌC</h1>

            <div class="camera-controls">
                <div class="card system-reason-card">
                    <h2>Lý do cảnh báo</h2>
                    <div class="value reason-text" id="alertReason">Đang cập nhật...</div>
                </div>

                <button id="darkModeToggle" class="mode-toggle-btn">🌙</button>
                
                <div class="notification-wrapper">
                    <div id="notificationBell">🔔</div>
                    <span id="notificationCount">0</span>

                    <div id="notificationDropdown">
                        <h3>Thông báo mới nhất</h3>
                        <div id="notificationList"></div>
                        <div class="view-more">Xem thêm</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="camera-view">
            <video id="cameraFeed" class="camera-feed" autoplay muted playsinline></video>
            <div class="camera-overlay">
                <button id="startCameraBtn" type="button">BẬT CAMERA</button>
                <span id="cameraStatus">Camera chưa được bật</span>
            </div>
        </div>
    </div>

    <div class="updated">
        <div class="update-time-text">
            Last Update: <span id="updatedAt">--</span>
        </div>
        
        <div class="connection-status">
            <div class="status-item">
                <span id="statusBackend" class="dot dot-red"></span>
                <span class="status-label">Backend</span>
            </div>
            <div class="status-item">
                <span id="statusEsp32" class="dot dot-red"></span>
                <span class="status-label">ESP32</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="Assets/js/app.js"></script>

</body>
</html>
